site_name: ChatPost 文档
site_url: https://arch.gh.wzhecnu.cn/ChatPost/
repo_url: https://github.com/ChatArch/ChatPost
repo_name: ChatArch/ChatPost
edit_uri: edit/main/docs/
docs_dir: docs/
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: ChatPost 文档
        - locale: en
          name: English
          build: true
          site_name: ChatPost Documentation
          nav_translations:
            首页: Home
            快速开始: Quickstart
            设计: Design
            总体架构: Overall Architecture
            配置、环境与状态: Configuration, Environment, and State
            任务流程: Task Flows
            知乎首次设置与草稿验收: Zhihu First Setup and Draft Acceptance
            命令与接口: Commands and APIs
            CLI 树: CLI Tree
            Browser Runner 与账号隔离: Browser Runners and Account Isolation
            能力地图: Capability Map
            Python 接口树: Python Interface Tree
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
extra_css:
  - stylesheets/extra.css
extra:
  alternate:
    - name: 中文
      link: /ChatPost/
      lang: zh
    - name: English
      link: /ChatPost/en/
      lang: en
nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 设计:
      - 总体架构: architecture.md
      - 配置、环境与状态: configuration.md
      - Browser Runner 与账号隔离: browser-runners.md
  - 任务流程:
      - 知乎首次设置与草稿验收: zhihu-first-run.md
  - 命令与接口:
      - CLI 树: cli-tree.md
      - 能力地图: capability-map.md
      - Python 接口树: interface-tree.md
