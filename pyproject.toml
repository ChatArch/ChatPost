[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatPost"
dynamic = ["version"]
description = "ChatArch multi-platform content publishing infrastructure package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
    "chatstyle>=0.1.1,<0.2.0",
    "chatenv>=0.2.0,<0.3.0",
    "chatup>=0.2.4,<0.3.0",
    "chatbrowser>=0.1.2,<0.2.0",
    "qrcode[pil]>=7.4,<9.0",
    "websocket-client>=1.8,<2.0",
    "websockets>=12.0,<16.0",
    "tomli>=2.0; python_version < '3.11'",
]
authors = [{name = "ChatArch", email = "rex@chatarch.org"}]
keywords = ["chatpost", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatPost"
Repository = "https://github.com/ChatArch/ChatPost"
Documentation = "https://arch.gh.wzhecnu.cn/ChatPost/"

[project.scripts]
chatpost = "chatpost.cli:main"

[project.entry-points."chatenv.configs"]
chatpost = "chatpost.config"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<9.7", "mkdocs-static-i18n>=1.2,<2.0", "mike>=2.0,<3.0"]

[tool.setuptools.dynamic]
version = {attr = "chatpost.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
